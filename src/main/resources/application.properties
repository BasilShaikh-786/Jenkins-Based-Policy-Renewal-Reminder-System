# ==============================================================================
# Jenkins-Based Policy Renewal Reminder System
# Application Configuration - Spring Boot 3.x
# Student: Basil Shaikh | Roll No: 23102C0026 | CMPN C
# ==============================================================================

spring.application.name=policy-renewal-reminder-system
# Configured on port 8081 to avoid collision with Jenkins service on port 8080
server.port=8081

# ------------------------------------------------------------------------------
# H2 Database - Persistent File-Based Configuration (Milestone 2 & H2 2.x Fix)
# ------------------------------------------------------------------------------
# Database files are stored in the ./data/ directory relative to the working
# directory from which the JAR is launched (typically the project root).
# Files created: data/policyrenewaldb.mv.db  and  data/policyrenewaldb.trace.db
#
# JDBC URL breakdown:
#   jdbc:h2:file:./data/policyrenewaldb   - file-based persistent storage path
#
# H2 2.2.224 Compatibility Note:
# In H2 2.2.224, combining AUTO_SERVER=TRUE and DB_CLOSE_ON_EXIT=FALSE is
# explicitly unsupported and throws JdbcSQLFeatureNotSupportedException:
# "Feature not supported: AUTO_SERVER=TRUE && DB_CLOSE_ON_EXIT=FALSE [50100-224]".
# For standard single-process Spring Boot execution, AUTO_SERVER=TRUE is not
# required (H2 console runs in the same JVM), and removing both parameters allows
# H2 to manage connection lifecycle cleanly without JVM shutdown conflicts.
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/policyrenewaldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8081/h2-console)
# Connect using JDBC URL: jdbc:h2:file:./data/policyrenewaldb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' adds missing columns/tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL initialisation is disabled for the persistent (production) profile.
# The seed data in data.sql was a one-time bootstrap; it must NOT be re-inserted
# on every restart because the file-based database already holds those records.
# To re-seed a clean database, set mode=always temporarily then revert.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Business Rules Configuration
# ------------------------------------------------------------------------------
# Number of days before expiration to flag a policy as "EXPIRING_SOON" (BR-03, FR-09)
renewal.alert.days=30

# ------------------------------------------------------------------------------
# Reminder Engine & Scheduling Configuration (Milestone 3)
# ------------------------------------------------------------------------------
# Discrete reminder notification windows in days (comma-separated)
reminder.windows=30,7,1

# Enable or disable the automated daily scheduled reminder job.
# Can be overridden at runtime by the environment variable REMINDER_SCHEDULE_ENABLED
# (e.g. export REMINDER_SCHEDULE_ENABLED=false before starting the JAR).
# Default: false — scheduling must be explicitly enabled for production deployments.
# Override to true only on the production server where a persistent DB is present.
reminder.schedule.enabled=false

# Daily reminder check cron expression.
# Default: 08:00 AM every day.  Format: second minute hour day-of-month month day-of-week
# Can be overridden by environment variable REMINDER_SCHEDULE_CRON.
reminder.schedule.cron=0 0 8 * * ?

# Timezone used for all date evaluation and scheduled job execution.
# Must be a valid java.time.ZoneId string.
# Default: Asia/Kolkata (IST, UTC+05:30).
# Can be overridden by environment variable SCHEDULER_TIMEZONE.
scheduler.timezone=Asia/Kolkata

# Notification delivery mode: true activates safe simulation/dry-run mode.
# Keep true until real SMTP credentials are configured and tested.
notification.simulation-mode=true

# ------------------------------------------------------------------------------
# Security Configuration (Milestone 4)
# ------------------------------------------------------------------------------
# Safe initial administrator & staff bootstrap configuration:
# Never store plaintext administrative credentials in git.
# In production, configure through environment variables:
#   APP_INITIAL_ADMIN_USERNAME (defaults to "admin")
#   APP_INITIAL_ADMIN_PASSWORD (defaults to "admin123")
#   APP_INITIAL_STAFF_USERNAME (defaults to "staff")
#   APP_INITIAL_STAFF_PASSWORD (defaults to "staff123")
app.security.initial-admin.username=${APP_INITIAL_ADMIN_USERNAME:admin}
app.security.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD:admin123}
app.security.initial-staff.username=${APP_INITIAL_STAFF_USERNAME:staff}
app.security.initial-staff.password=${APP_INITIAL_STAFF_PASSWORD:staff123}

# ------------------------------------------------------------------------------
# Safe One-Time Admin Password Recovery Mode
# ------------------------------------------------------------------------------
# Command-line-only recovery mode to update the password of an existing user.
# Activated via explicit flag: --recover-admin or --app.admin-recovery.enabled=true
# (or environment variable APP_ADMIN_RECOVERY_ENABLED=true).
# Target username defaults to "admin", can be specified via --username=<user>.
# Accepts the new password strictly from environment variable APP_ADMIN_PASSWORD_RESET_PASSWORD.
app.admin-recovery.enabled=${APP_ADMIN_RECOVERY_ENABLED:false}
app.admin-recovery.username=${APP_ADMIN_PASSWORD_RESET_USERNAME:admin}
app.admin-recovery.password=${APP_ADMIN_PASSWORD_RESET_PASSWORD:}
