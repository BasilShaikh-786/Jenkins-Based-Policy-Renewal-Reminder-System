# ==============================================================================
# Jenkins-Based Policy Renewal Reminder System
# Application Configuration - Spring Boot 3.x
# Student: Basil Shaikh | Roll No: 23102C0026 | CMPN C
# ==============================================================================

spring.application.name=policy-renewal-reminder-system
# Configured on port 8081 to avoid collision with Jenkins service on port 8080
server.port=8081

# ------------------------------------------------------------------------------
# H2 Database In-Memory Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:policyrenewaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Initialize database schema and synthetic data from data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Business Rules Configuration
# ------------------------------------------------------------------------------
# Number of days before expiration to flag a policy as "EXPIRING_SOON" (BR-03, FR-09)
renewal.alert.days=30

# ------------------------------------------------------------------------------
# Reminder Engine & Scheduling Configuration
# ------------------------------------------------------------------------------
# Discrete reminder notification windows in days (comma-separated)
reminder.windows=30,7,1

# Enable or disable automated daily reminder checking job
reminder.schedule.enabled=true

# Daily reminder check cron trigger (runs every day at 08:00 AM)
reminder.schedule.cron=0 0 8 * * ?

# Notification delivery mode: true activates safe simulation/dry-run mode
notification.simulation-mode=true

