# ==============================================================================
# Jenkins-Based Policy Renewal Reminder System
# TEST Application Configuration — overrides main application.properties
# Student: Basil Shaikh | Roll No: 23102C0026 | CMPN C
# ==============================================================================
# This file is ONLY loaded during 'mvn test' / @SpringBootTest executions.
# It intentionally uses an in-memory H2 database so:
#   1. Tests are fully isolated from any file-based production database.
#   2. No test data is ever written to disk.
#   3. Each test context starts with a clean schema managed by Hibernate.
# ==============================================================================

spring.application.name=policy-renewal-reminder-system-test

# ------------------------------------------------------------------------------
# H2 In-Memory Database — test isolation
# ------------------------------------------------------------------------------
# Uses a named in-memory instance (not file-based) so every test run starts
# fresh with an empty schema populated only by Hibernate's ddl-auto=create.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console disabled in test environment
spring.h2.console.enabled=false

# ------------------------------------------------------------------------------
# JPA / Hibernate — test schema management
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'create-drop' creates a fresh schema for each test context and drops it on close
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql so integration tests start with the synthetic seed dataset.
# This is safe because the in-memory DB is discarded after each test context.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------------------------
# Thymeleaf — same as production (caching off for correctness in tests)
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Business Rules — same as production
# ------------------------------------------------------------------------------
renewal.alert.days=30

# ------------------------------------------------------------------------------
# Reminder Engine — scheduling DISABLED in tests to prevent background jobs
# from firing during assertions and causing flaky results.
# ------------------------------------------------------------------------------
reminder.windows=30,7,1
reminder.schedule.enabled=false
reminder.schedule.cron=0 0 8 * * ?

# Timezone — must match the production setting so timezone-sensitive tests
# produce deterministic results regardless of the CI server's OS timezone.
scheduler.timezone=Asia/Kolkata

# Simulation mode stays on; tests must never send real emails
notification.simulation-mode=true

# ------------------------------------------------------------------------------
# Security Configuration — test credentials
# ------------------------------------------------------------------------------
app.security.initial-admin.username=testadmin
app.security.initial-admin.password=TestAdmin@123
app.security.initial-staff.username=teststaff
app.security.initial-staff.password=TestStaff@123

# ------------------------------------------------------------------------------
# Admin Recovery Configuration — disabled by default in test profile
# ------------------------------------------------------------------------------
app.admin-recovery.enabled=false
app.admin-recovery.username=admin
app.admin-recovery.password=
